version: '3.8'

services:
  web:
    build: .
    container_name: omniverse-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  scheduler:
    build: .
    container_name: omniverse-scheduler
    restart: always
    command: node lib/queue/scheduler.js
    env_file:
      - .env

  worker:
    build: .
    container_name: omniverse-worker
    restart: always
    command: node lib/queue/worker-process.js
    env_file:
      - .env

networks:
  default:
    name: omniverse-network
